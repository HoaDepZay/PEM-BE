version: '3.8'

services:
  backend:
    build: .
    container_name: visual-finance-backend
    restart: always
    env_file:
      - .env # Ensure you create a .env file on your server
    # Cloudflared will connect to this container internally on port 8080.
    # No need to expose ports to the host machine if we only use Cloudflare Tunnel!
    # ports:
    #   - "8080:8080" 

  # Cloudflare Tunnel Container
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: visual-finance-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  minio_data:
